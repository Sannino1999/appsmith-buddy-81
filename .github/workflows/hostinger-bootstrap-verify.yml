name: Verifica Fase 2

on:
  pull_request:
    branches:
      - main
      - fase-0-audit
  push:
    branches:
      - fix/fase-2-lint
      - fase-2-finalizzazione
      - fix/hostinger-bootstrap-entry
      - fase-2-db-bootstrap
      - fix/mysql-pool-lifecycle

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Formatta automaticamente il repository
        if: github.event_name == 'push' && contains(fromJSON('["refs/heads/fix/fase-2-lint","refs/heads/fase-2-finalizzazione","refs/heads/fase-2-db-bootstrap","refs/heads/fix/hostinger-bootstrap-entry"]'), github.ref)
        run: |
          npx prettier --write .
          if git diff --quiet; then
            echo "Nessuna modifica Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "prettier-autoformat"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash pop
          git add -A
          git commit -m "chore: formatta repository con Prettier"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Bootstrap DB senza configurazione
        run: npm run db:bootstrap

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint ESLint
        run: npm run lint

      - name: Controllo formattazione
        run: npm run format:check
