name: Verifica Fase 4

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fase-4-grafica-menu

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint ESLint
        run: npm run lint

      - name: Controllo formattazione
        run: npm run format:check
