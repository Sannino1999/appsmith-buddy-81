name: Verifica Fase 2

on:
  pull_request:
    branches:
      - main
      - fase-0-audit
  push:
    branches:
      - fix/fase-2-ci

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze e aggiorna lockfile
        run: npm install --no-audit --no-fund

      - name: Aggiorna package-lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/fase-2-ci'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json già aggiornato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fase 2: aggiorna package-lock"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint completo (baseline)
        run: npm run lint
        continue-on-error: true
