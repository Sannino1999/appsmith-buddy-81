name: Verifica Fase 5

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fase-5-admin-chat
      - lubrano-redesign-pwa-security

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test parser e permessi
        run: npm run admin:test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Formattazione
        run: npx prettier --check .

      - name: Audit dipendenze ad alto rischio
        run: npm audit --audit-level=high --omit=dev
