name: Verifica Fase 3

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fase-3-rimozione-dipendenze

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aggiorna package-lock
        if: github.event_name == 'push'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json già allineato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fase 3: aggiorna package-lock dopo rimozione legacy"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Formatta i file della Fase 3
        if: github.event_name == 'push'
        run: |
          npx prettier --write src/lib/menu.functions.ts src/routes/api/public/telegram/webhook.ts
          if git diff --quiet; then
            echo "File della Fase 3 già formattati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/menu.functions.ts src/routes/api/public/telegram/webhook.ts
          git commit -m "fase 3: formatta moduli senza Supabase"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Installa dipendenze esatte
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint ESLint
        run: npm run lint

      - name: Controllo formattazione
        run: npm run format:check
