name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Admin parser and permissions tests
        run: npm run admin:test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Scan for legacy platform references
        shell: bash
        run: |
          if grep -RniE 'lovable\.app|lovable\.dev|@lovable|__l5e|\.lovable' .             --exclude-dir=.git             --exclude='package-lock.json'; then
            echo "Legacy platform reference found."
            exit 1
          fi
