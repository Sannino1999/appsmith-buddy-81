<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="55%" stop-color="#c8722e"/>
      <stop offset="100%" stop-color="#a83232"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8c87a"/>
    </linearGradient>
  </defs>

  <!-- Emblem: circular badge with flame -->
  <g transform="translate(200,62)">
    <circle cx="0" cy="0" r="50" stroke="#a83232" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="0" r="44" stroke="#e8c87a" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Flame -->
    <path d="M0,-30 C-14,-14 -18,-4 -12,8 C-16,4 -18,10 -14,18 C-10,26 -4,30 0,30 C4,30 10,26 14,18 C18,10 16,4 12,8 C18,-4 14,-14 0,-30 Z"
          fill="url(#flameGrad)"/>
    <!-- Inner flame highlight -->
    <path d="M0,-18 C-6,-8 -8,-2 -4,6 C-6,4 -7,8 -5,14 C-2,20 1,22 0,22 C1,22 4,20 5,14 C7,8 6,4 4,6 C8,-2 6,-8 0,-18 Z"
          fill="#e8c87a" opacity="0.6"/>
    <!-- Grill grate lines at base -->
    <g stroke="#a83232" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="-16" y1="34" x2="16" y2="34"/>
      <line x1="-13" y1="38" x2="13" y2="38"/>
    </g>
  </g>

  <!-- LUBRANO -->
  <text x="200" y="148" text-anchor="middle"
        font-family="'Oswald','Arial Narrow',sans-serif"
        font-size="52" font-weight="700"
        letter-spacing="6"
        fill="url(#textGrad)">LUBRANO</text>

  <!-- Decorative divider -->
  <g transform="translate(200,162)">
    <line x1="-80" y1="0" x2="-12" y2="0" stroke="#a83232" stroke-width="1.5"/>
    <line x1="12" y1="0" x2="80" y2="0" stroke="#a83232" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#e8c87a"/>
  </g>

  <!-- PUB & BRACERIA -->
  <text x="200" y="184" text-anchor="middle"
        font-family="'Oswald','Arial Narrow',sans-serif"
        font-size="18" font-weight="500"
        letter-spacing="8"
        fill="#e8c87a">PUB &amp; BRACERIA</text>

  <!-- Napoli -->
  <text x="200" y="204" text-anchor="middle"
        font-family="'Nunito',sans-serif"
        font-size="11" font-weight="600"
        letter-spacing="3"
        fill="#a83232" opacity="0.85">NAPOLI</text>
</svg>
