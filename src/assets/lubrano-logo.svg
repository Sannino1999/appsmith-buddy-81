<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none">
  <title>Lubrano Pub &amp; Braceria</title>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#E8DCC4"/>
    </linearGradient>
    <linearGradient id="bordeaux" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0303A"/>
      <stop offset="100%" stop-color="#7A1E28"/>
    </linearGradient>
  </defs>

  <!-- Top ornament line -->
  <line x1="170" y1="24" x2="430" y2="24" stroke="#B0303A" stroke-width="1.5" opacity="0.6"/>
  <circle cx="300" cy="24" r="3" fill="#B0303A"/>

  <!-- Burger emblem -->
  <g transform="translate(300, 92)">
    <!-- top bun -->
    <path d="M-68 0C-68-37-34-60 0-60S68-37 68 0Z" fill="url(#ivory)"/>
    <!-- sesame seeds -->
    <ellipse cx="-28" cy="-28" rx="4" ry="2.5" fill="#C8B88A" transform="rotate(-15 -28 -28)"/>
    <ellipse cx="-8" cy="-38" rx="4" ry="2.5" fill="#C8B88A"/>
    <ellipse cx="14" cy="-34" rx="4" ry="2.5" fill="#C8B88A" transform="rotate(12 14 -34)"/>
    <ellipse cx="32" cy="-22" rx="4" ry="2.5" fill="#C8B88A" transform="rotate(20 32 -22)"/>
    <!-- lettuce -->
    <path d="M-70 4Q-60 14-50 6T-30 10T-10 6T10 10T30 6T50 10T70 4V14H-70Z" fill="#7A9B5A"/>
    <!-- patty -->
    <rect x="-66" y="14" width="132" height="20" rx="6" fill="#8B5E3C"/>
    <!-- cheese drip -->
    <path d="M-50 34L-44 42L-38 34M-18 34L-12 44L-6 34M14 34L20 42L26 34" fill="#E8A838" stroke="none"/>
    <!-- bottom bun -->
    <path d="M-68 38H68V50C68 56 62 60 56 60H-56C-62 60-68 56-68 50Z" fill="url(#ivory)"/>
  </g>

  <!-- LUBRANO -->
  <text x="300" y="222" text-anchor="middle"
    font-family="'Oswald','Arial Narrow',sans-serif"
    font-size="78" font-weight="700"
    letter-spacing="4"
    fill="url(#ivory)">LUBRANO</text>

  <!-- Divider with fork & knife -->
  <g transform="translate(300, 252)">
    <line x1="-130" y1="0" x2="-22" y2="0" stroke="url(#bordeaux)" stroke-width="1.5"/>
    <line x1="22" y1="0" x2="130" y2="0" stroke="url(#bordeaux)" stroke-width="1.5"/>
    <!-- fork -->
    <g transform="translate(-14, 0)" fill="url(#ivory)">
      <rect x="-1.5" y="-12" width="3" height="24" rx="1"/>
      <rect x="-5" y="-12" width="1.5" height="7" rx="0.5"/>
      <rect x="-2.25" y="-12" width="1.5" height="7" rx="0.5"/>
      <rect x="0.5" y="-12" width="1.5" height="7" rx="0.5"/>
    </g>
    <!-- knife -->
    <g transform="translate(14, 0)" fill="url(#ivory)">
      <rect x="-1" y="-12" width="2" height="24" rx="1"/>
      <path d="M1-12C8-10 10-4 8 0H1Z"/>
    </g>
  </g>

  <!-- 5 stars -->
  <g transform="translate(300, 286)" fill="#B0303A">
    <path d="M-80 0L-74-18L-68 0L-56 0L-66 8L-62 22L-74 13L-86 22L-82 8L-92 0Z" transform="scale(0.7)"/>
    <path d="M-40 0L-34-18L-28 0L-16 0L-26 8L-22 22L-34 13L-46 22L-42 8L-52 0Z" transform="scale(0.7)"/>
    <path d="M0 0L6-18L12 0L24 0L14 8L18 22L6 13L-6 22L-2 8L-12 0Z" transform="scale(0.7)"/>
    <path d="M40 0L46-18L52 0L64 0L54 8L58 22L46 13L34 22L38 8L28 0Z" transform="scale(0.7)"/>
    <path d="M80 0L86-18L92 0L104 0L94 8L98 22L86 13L74 22L78 8L68 0Z" transform="scale(0.7)"/>
  </g>

  <!-- PUB & BRACERIA -->
  <text x="300" y="348" text-anchor="middle"
    font-family="'Oswald','Arial Narrow',sans-serif"
    font-size="26" font-weight="500"
    letter-spacing="10"
    fill="url(#ivory)">PUB <tspan fill="url(#bordeaux)">&amp;</tspan> BRACERIA</text>

  <!-- Bottom ornament -->
  <line x1="170" y1="384" x2="430" y2="384" stroke="#B0303A" stroke-width="1.5" opacity="0.6"/>
  <circle cx="300" cy="384" r="3" fill="#B0303A"/>

  <!-- Napoli -->
  <text x="300" y="412" text-anchor="middle"
    font-family="'Nunito',sans-serif"
    font-size="14" font-weight="600"
    letter-spacing="6"
    fill="#B0303A" opacity="0.85">NAPOLI</text>
</svg>
